name: Mobile CI

on:
  push:
    paths:
      - 'mobile-client/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile-client/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Verify Expo bundles
        run: npx expo export --platform all --output-dir dist-ci
